name: Docker build and DockerHub push
on:
  push:
    branches: [ "main" ]
#  pull_request:
#    branches: [ "main" ]

permissions:
  contents: read

jobs:
  docker-test:
    uses: ./.github/workflows/docker_test.yml

  webserver-test:
    uses: ./.github/workflows/python_webserver.yml

  python-test:
    uses: ./.github/workflows/python_test.yml

  docker-build-push:
    needs:
      - docker-test
      - python-test
      - webserver-test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ vars.DOCKER_HUB_USERNAME }}/${{ vars.DOCKER_HUB_REPOSITORY }}
          tags: |
            type=raw,value=latest

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run container
        run: |
          docker run -d --rm --name ocr-test -p 8001:8001 ${{ steps.meta.outputs.tags }}

      - name: Wait for Webserver to become healthy
        run: |
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors \
              http://localhost:8001/healthcheck \
              && echo "Webserver is healthy" || echo "Webserver did not become healthy in time"

      - name: Test Webserver
        run: |
          curl -f http://localhost:8001/healthcheck

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs ocr-test || true

      - name: Stop container
        if: always()
        run: |
          docker stop ocr-test || true

      - name: Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
