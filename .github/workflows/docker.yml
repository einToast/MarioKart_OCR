name: Docker build and DockerHub push
on:
  push:
    branches: [ "main" ]
#  pull_request:
#    branches: [ "main" ]

permissions:
  contents: read

jobs:
  docker-test:
    uses: ./.github/workflows/docker_test.yml

  webserver-test:
    uses: ./.github/workflows/python_webserver.yml

  python-test:
    uses: ./.github/workflows/python_test.yml

  docker-build-push:
    needs:
      - docker-test
      - python-test
      - webserver-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKER_HUB_USERNAME }}/${{ vars.DOCKER_HUB_REPOSITORY }}
          tags: |
            type=raw,value=latest

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run container
        run: |
          docker run -d --rm --name ocr-test -p 8001:8001 ${{ steps.meta.outputs.tags }}

      - name: Wait for Webserver to become healthy
        run: |
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors \
              http://localhost:8001/healthcheck \
              && echo "Webserver is healthy" || echo "Webserver did not become healthy in time"

      - name: Test Webserver
        run: |
          curl -f http://localhost:8001/healthcheck

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs ocr-test || true

      - name: Stop container
        if: always()
        run: |
          docker stop ocr-test || true

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
