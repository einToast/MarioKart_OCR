name: Update uv lockfile

on:
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    name: Update uv.lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Update lockfile
        run: uv lock --upgrade

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(deps): update uv lockfile"
          title: "chore(deps): update uv lockfile"
          body: |
            Monthly refresh of uv dependencies.
            Generated using `uv lock --upgrade`.
          branch: automation/uv-lockfile-update
          add-paths: uv.lock
          delete-branch: true
