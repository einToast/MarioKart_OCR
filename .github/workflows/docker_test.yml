name: Docker Build

on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image (no push)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        tags: docker-test-python:latest

    - name: Run container
      run: |
        docker run -d --rm --name ocr-test -p 8001:8001 docker-test-python:latest

    - name: Wait for Webserver to become healthy
      run: |
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors \
              http://localhost:8001/healthcheck \
              && echo "Webserver is healthy" || echo "Webserver did not become healthy in time"

    - name: Test Webserver
      run: |
        curl -f http://localhost:8001/healthcheck

    - name: Show container logs on failure
      if: failure()
      run: |
        docker logs ocr-test || true

    - name: Stop container
      if: always()
      run: |
        docker stop ocr-test || true
