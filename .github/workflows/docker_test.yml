name: Docker Build

on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  docker-test:
    name: docker-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build Docker image (no push)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        tags: docker-test-python:latest
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

    - name: Run container
      run: |
        docker run -d --rm --name ocr-test -p 8001:8001 docker-test-python:latest

    - name: Wait for Webserver to become healthy
      run: |
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors \
              http://localhost:8001/healthcheck \
              && echo "Webserver is healthy" || echo "Webserver did not become healthy in time"

    - name: Test Webserver
      run: |
        curl -f http://localhost:8001/healthcheck

    - name: Show container logs on failure
      if: failure()
      run: |
        docker logs ocr-test || true

    - name: Stop container
      if: always()
      run: |
        docker stop ocr-test || true
