name: Python Tests

on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
    python-test:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v7

        - name: Set up uv
          uses: astral-sh/setup-uv@v10.2.0
          with:
            version: "0.12.16"
            python-version: "3.14"
            enable-cache: true

        - name: Install dependencies
          run: uv sync --locked

        - name: Run tests
          run: uv run pytest
