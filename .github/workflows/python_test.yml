name: Python Tests

on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
    python-test:
        name: python-test (${{ matrix.arch }})
        strategy:
          fail-fast: false
          matrix:
            include:
              - arch: amd64
                runner: ubuntu-24.04
              - arch: arm64
                runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}

        steps:
        - uses: actions/checkout@v7

        - name: Set up uv
          uses: astral-sh/setup-uv@v10.3.0
          with:
            version: "0.12.16"
            python-version: "3.14"
            enable-cache: true

        - name: Install dependencies
          run: uv sync --locked

        - name: Run tests
          run: uv run pytest
