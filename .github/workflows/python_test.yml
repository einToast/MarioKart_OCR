name: Python Tests

on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
    python-test:
        name: python-test (${{ matrix.arch }})
        strategy:
          fail-fast: false
          matrix:
            include:
              - arch: amd64
                runner: ubuntu-24.04
              - arch: arm64
                runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}

        steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - name: Set up uv
          uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
          with:
            version: "0.12.16"
            enable-cache: true

        - name: Install dependencies
          run: uv sync --locked --no-build

        - name: Run tests
          run: uv run --locked --no-build pytest
