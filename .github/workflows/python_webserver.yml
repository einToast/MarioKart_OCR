name: Test Python Webserver

on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
    webserver-test:
        name: webserver-test (${{ matrix.arch }})
        strategy:
          fail-fast: false
          matrix:
            include:
              - arch: amd64
                runner: ubuntu-24.04
              - arch: arm64
                runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}

        steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - name: Set up uv
          uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
          with:
            enable-cache: true

        - name: Install dependencies
          run: uv sync --locked --no-build
        
        - name: Start Webserver in Background
          run: |
            nohup uv run --locked --no-build fastapi dev src/webserver.py --port 8001 > webserver.log 2>&1 & echo $! > server.pid

        - name: Wait for Webserver to become healthy
          run: |
            curl --fail --silent --show-error \
                 --retry 15 --retry-delay 2 --retry-connrefused \
                 http://localhost:8001/healthcheck

        - name: Test Webserver
          run: |
            curl -f http://localhost:8001/healthcheck
        
        - name: Test Webserver provider
          run: |
            curl -f http://localhost:8001/providers

        - name: Show server logs on failure
          if: failure()
          run: |
            echo "--- webserver.log (tail) ---" && tail -n 200 webserver.log || true

        - name: Stop Webserver
          if: always()
          run: |
            if [ -f server.pid ]; then kill $(cat server.pid) || true; fi
