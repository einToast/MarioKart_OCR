[project]
name = "MarioKart_OCR"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.28.0",
    "mistralai>=2.10.1",
    "openai>=3.15.0",
    "openrouter>=1.1.156",
    "pydantic>=2.12.5",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
