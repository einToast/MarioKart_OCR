[project]
name = "MarioKart_OCR"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "anthropic==2.10.0",
    "fastapi[standard]==0.164.0",
    "google-genai==3.5.0",
    "mistralai==3.7.0",
    "openai==3.55.1",
    "openrouter==1.3.190",
    "pydantic==2.14.3",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.13"
