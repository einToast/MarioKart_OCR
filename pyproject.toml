[project]
name = "MarioKart_OCR"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "anthropic==2.8.0",
    "fastapi[standard]==0.162.4",
    "google-genai==3.2.0",
    "mistralai==3.7.0",
    "openai==3.49.0",
    "openrouter==1.3.160",
    "pydantic==2.14.3",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.13"
