[project]
name = "MarioKart_OCR"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "anthropic==2.4.0",
    "fastapi[standard]==0.162.0",
    "google-genai==2.34.0",
    "mistralai==3.7.0",
    "openai==3.45.0",
    "openrouter==1.3.117",
    "pydantic==2.14.2",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.13"
