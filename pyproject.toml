[project]
name = "MarioKart_OCR"
version = "0.1.0"
requires-python = "==3.15.*"
dependencies = [
    "anthropic==2.13.0",
    "fastapi[standard]==0.165.0",
    "google-genai==3.6.1",
    "mistralai==3.8.0",
    "openai==3.58.0",
    "openrouter==1.3.207",
    "pydantic==2.14.4",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.13"
