[project]
name = "MarioKart_OCR"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.14.0",
    "fastapi[standard]>=0.143.1",
    "google-genai>=2.30.1",
    "mistralai>=3.2.0",
    "openai>=3.29.0",
    "openrouter>=1.3.52",
    "pydantic>=2.12.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
