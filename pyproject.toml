[project]
name = "MarioKart_OCR"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.1.0",
    "fastapi[standard]>=0.159.1",
    "google-genai>=2.32.0",
    "mistralai>=3.3.0",
    "openai>=3.36.0",
    "openrouter>=1.3.67",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
