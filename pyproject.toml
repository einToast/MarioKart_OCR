[project]
name = "MarioKart_OCR"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "anthropic>=2.2.0",
    "fastapi[standard]>=0.162.0",
    "google-genai>=2.33.0",
    "mistralai>=3.3.0",
    "openai>=3.37.0",
    "openrouter>=1.3.79",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
